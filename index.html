        </div>`}
      </section>
      <section class="carte bloc" style="padding:8px" id="bloc-liste">
        <div class="commandes" style="padding:10px 10px 0;margin-bottom:10px">
          <h2 style="margin:0">Liste des ventes</h2>
          <button class="btn" id="v-export" style="min-height:40px" title="Télécharger la liste affichée au format CSV (Excel, Numbers, LibreOffice)">${ICONES.telecharger}Exporter</button>
        </div>
        <div class="outils-ventes">
          <input id="v-q" type="search" enterkeyhint="search" placeholder="Rechercher un titre…" aria-label="Rechercher une vente par titre" value="${esc(cfg.f.q)}">
          <button class="btn" id="v-filtres" aria-expanded="${cfg.panneau}" aria-controls="v-panneau">${ICONES.filtres}Filtres<span class="pastille" id="v-nb" hidden></span></button>
          <select id="v-tri" class="tri" aria-label="Trier la liste des ventes">${Object.entries(TRIS_VENTES).map(([c, l]) => `<option value="${c}" ${c === cfg.tri ? "selected" : ""}>${l}</option>`).join("")}</select>
        </div>
        <form class="panneau-filtres" id="v-panneau" ${cfg.panneau ? "" : "hidden"} novalidate>
          <div class="grille-filtres">
            <div><label for="vf-du">Vendue du</label><input id="vf-du" type="date"></div>
            <div><label for="vf-au">au</label><input id="vf-au" type="date"></div>
            <div><label for="vf-min">Prix de vente, de (€)</label><input id="vf-min" inputmode="decimal" autocomplete="off"></div>
            <div><label for="vf-max">à (€)</label><input id="vf-max" inputmode="decimal" autocomplete="off"></div>
            <div><label for="vf-nature">Nature</label><select id="vf-nature"><option value="">Toutes</option>${valeurs("nature").map((x) => `<option>${esc(x)}</option>`).join("")}</select></div>
            <div><label for="vf-technique">Technique</label><select id="vf-technique"><option value="">Toutes</option>${valeurs("technique").map((x) => `<option>${esc(x)}</option>`).join("")}</select></div>
            <div><label for="vf-port">Frais de port</label><select id="vf-port"><option value="">Indifférent</option><option value="avec">Avec port</option><option value="sans">Sans port</option></select></div>
            <div><label for="vf-etat">Fiche de vente</label><select id="vf-etat"><option value="">Toutes</option><option value="complete">Complètes</option><option value="incomplete">À compléter</option></select></div>
          </div>
          <div id="vf-erreur" role="alert"></div>
          <div class="actions-filtres">
            <button class="btn" type="button" id="vf-raz">Réinitialiser</button>
            <button class="btn plein" type="submit">Appliquer</button>
          </div>
        </form>
        <div class="actifs" id="v-actifs" hidden></div>
        <p class="sous" id="v-resume" aria-live="polite" style="padding:0 10px;margin:10px 0 6px"></p>
        <div id="liste-ventes"></div>
      </section>`}`;

    $("#retour").addEventListener("click", vueListe);
    if (!ventes.length) return;
    monterListe(series);
    $("#grain").addEventListener("click", (e) => { const b = e.target.closest("[data-grain]"); if (!b || b.dataset.grain === cfg.grain) return; cfg.grain = b.dataset.grain; cfg.periode = null; dessiner(); });
    if ($("#annee")) $("#annee").addEventListener("change", (e) => { cfg.annee = +e.target.value; cfg.periode = null; dessiner(); });
    $("#liste-ventes").addEventListener("click", (e) => { const b = e.target.closest("[data-id]"); if (b) vueFiche(b.dataset.id, "ventes"); });
    const graphe = $("#graphe"); if (!graphe) return;
    const bulle = $("#infobulle"), zone = graphe.querySelector(".zone");
    const montrer = (col) => {
      const s = series[+col.dataset.i];
      bulle.textContent = "";
      const fort = document.createElement("strong"); fort.textContent = euros(s.total + s.port);
      bulle.append(fort, document.createTextNode(`${s.nom}, ${pluriel(s.n, "vente")}`));
      if (s.port) { const detail = document.createElement("span"); detail.className = "detail"; detail.textContent = `Tableaux ${euros(s.total)}, port ${euros(s.port)}`; bulle.append(detail); }
      bulle.hidden = false;
      const z = zone.getBoundingClientRect(), c = col.getBoundingClientRect(), demi = bulle.offsetWidth / 2;
      bulle.style.left = Math.min(z.width - demi, Math.max(demi, c.left - z.left + c.width / 2)) + "px";
      bulle.style.top = Math.max(bulle.offsetHeight, col.querySelector(".barre").getBoundingClientRect().top - z.top - 6) + "px";
    };
    zone.querySelectorAll(".col").forEach((col) => {
      col.addEventListener("pointerenter", () => montrer(col));
      col.addEventListener("focus", () => montrer(col));
      col.addEventListener("pointerleave", () => { bulle.hidden = true; });
      col.addEventListener("blur", () => { bulle.hidden = true; });
      col.addEventListener("click", () => { const s = series[+col.dataset.i]; cfg.periode = cfg.periode === s.cle ? null : s.cle; dessiner(false); });
    });
  }
  dessiner();
}

/* ---------- Corbeille (administrateur) ---------- */
async function vueCorbeille(message = "", type = "info") {
  if (!etat.admin) return vueListe();
  majLateral("corbeille");
  window.scrollTo(0, 0);
  app.innerHTML = `<p class="sous">Chargement…</p>`;
  const { data, error } = await sb.from("oeuvres").select("id,titre,vignette_path,supprime_le")
    .not("supprime_le", "is", null).order("supprime_le", { ascending: false }).limit(1000);
  const items = data || [];
  if (error) { message = msgErreur(error); type = "erreur"; }
  else { etat.enCorbeille = items.length; majLateral(); }
  const jour = (d) => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  app.innerHTML = `
    <div id="corb" class="corb etroit">
      ${entete("Corbeille")}
      <p class="sous">Les œuvres supprimées restent ici tant qu'un administrateur ne les efface pas définitivement.</p>
      <div id="alerte">${message ? `<div class="message ${type}">${message}</div>` : ""}</div>
      ${items.map((o) => `
        <section class="carte bloc" data-id="${o.id}">
          <div class="tete"><img loading="lazy" alt="" src="${esc(urlPhoto(o.vignette_path))}">
            <div><strong>${esc(o.titre)}</strong><div class="sous">Supprimée le ${esc(jour(o.supprime_le))}</div></div></div>
          <div class="rang"><button class="btn" data-action="restaurer">Restaurer</button><button class="btn danger" data-action="effacer">Supprimer</button></div>
        </section>`).join("") || `<div class="vide">La corbeille est vide.</div>`}
      ${items.length ? `<button class="btn danger large" id="vider" style="margin-top:8px">Vider la corbeille (${items.length})</button>` : ""}
    </div>`;
  $("#retour").addEventListener("click", () => vueAdmin());
  const erreur = (m) => { $("#alerte").innerHTML = `<div class="message erreur">${m}</div>`; window.scrollTo(0, 0); };

  $("#corb").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-action]"); if (!b) return;
    const o = items.find((x) => x.id === b.closest("[data-id]").dataset.id);
    try {
      if (b.dataset.action === "restaurer") {
        b.disabled = true;
        const res = await sb.from("oeuvres").update({ supprime_le: null }).eq("id", o.id).select("id");
        if (res.error) throw res.error;
        return vueCorbeille(`« ${esc(o.titre)} » a été restaurée dans le catalogue.`);
      }
      const accord = await confirmer({
        titre: "Supprimer définitivement ?",
        corps: `« ${o.titre} » et ses photos seront effacées. Cette action est irréversible.`,
        vignette: urlPhoto(o.vignette_path), action: "Supprimer définitivement"
      });
      if (!accord) return;
      b.disabled = true;
      const res = await sb.from("oeuvres").delete().eq("id", o.id).select("photo_path,vignette_path");
      if (res.error) throw res.error;
      if (!res.data.length) throw new Error("Suppression refusée : droits insuffisants.");
      await effacerPhotos(res.data);
      vueCorbeille(`« ${esc(o.titre)} » a été supprimée définitivement.`);
    } catch (err) { b.disabled = false; erreur(msgErreur(err)); }
  });

  if (items.length) $("#vider").addEventListener("click", async () => {
    const accord = await confirmer({
      titre: "Vider la corbeille ?",
      corps: `${items.length} œuvre${items.length > 1 ? "s" : ""} et leurs photos seront effacées. Cette action est irréversible.`,
      action: "Tout supprimer définitivement"
    });
    if (!accord) return;
    $("#vider").disabled = true;
    try {
      const res = await sb.from("oeuvres").delete().not("supprime_le", "is", null).select("photo_path,vignette_path");
      if (res.error) throw res.error;
      await effacerPhotos(res.data);
      vueCorbeille(`Corbeille vidée : ${res.data.length} œuvre${res.data.length > 1 ? "s" : ""} supprimée${res.data.length > 1 ? "s" : ""} définitivement.`);
    } catch (err) { $("#vider").disabled = false; erreur(msgErreur(err)); }
  });
}

/* ---------- Espace administrateur ---------- */
async function vueAdmin(message = "", type = "info") {
  if (!etat.admin) return vueListe();
  majLateral("admin");
  window.scrollTo(0, 0);
  app.innerHTML = `<p class="sous">Chargement…</p>`;
  try { await chargerChamps(); await chargerTarifs(); } catch (e) { message = msgErreur(e); type = "erreur"; }
  const { count: enCorbeille } = await sb.from("oeuvres").select("id", { count: "exact", head: true }).not("supprime_le", "is", null);
  const carte = (c) => `
    <details class="carte bloc champ" data-champ="${c.id}" ${etat.adminOuvert === c.id ? "open" : ""}>
      <summary><span class="nom">${esc(c.libelle)}</span><span class="sous">${TYPES[c.type]}${c.type === "liste" ? `, ${c.options.length} choix` : ""}</span></summary>
      <label for="lib-${c.id}">Libellé du champ</label>
      <div class="rang"><input id="lib-${c.id}" value="${esc(c.libelle)}" autocomplete="off"><button class="btn" data-action="libelle">Enregistrer</button></div>
      ${c.type === "liste" ? `
        <label>Choix proposés</label>
        ${c.options.map((v, i) => `
          <div class="rang option"><input data-option="${i}" data-initial="${esc(v)}" value="${esc(v)}" aria-label="Choix ${i + 1}" autocomplete="off">
          <button class="btn icone-carree" data-action="renommer" data-i="${i}" aria-label="Enregistrer le nouveau nom" title="Enregistrer le nouveau nom" disabled>${ICONES.valider}</button>
          <button class="btn danger icone-carree" data-action="retirer" data-i="${i}" aria-label="Retirer le choix ${esc(v)}" title="Retirer ce choix">${ICONES.corbeille}</button></div>`).join("") || `<p class="sous">Aucun choix pour l'instant.</p>`}
        <p class="aide">Modifiez un nom puis validez avec la coche : les œuvres concernées sont mises à jour.</p>
        <div class="rang"><input data-nouveau placeholder="Nouveau choix" aria-label="Nouveau choix" autocomplete="off"><button class="btn" data-action="ajouter">Ajouter</button></div>` : ""}
      ${c.systeme ? "" : `<div class="zone-danger"><button class="btn danger" data-action="supprimer">Supprimer ce champ</button></div>`}
    </details>`;
  app.innerHTML = `
    <div id="adm" class="etroit">
      ${entete("Administration")}
      <p class="sous">Champs et listes de choix des fiches. Les modifications s'appliquent à toutes les œuvres.</p>
      <div id="alerte">${message ? `<div class="message ${type}">${message}</div>` : ""}</div>
      <button class="btn discret" id="revoir-tuto" style="margin:0 0 12px -14px">${ICONES.aide}Revoir le tutoriel de prise en main</button>
      <section class="carte bloc">
        <h2>Corbeille</h2>
        <p class="sous">${enCorbeille ? `${enCorbeille} œuvre${enCorbeille > 1 ? "s" : ""} supprimée${enCorbeille > 1 ? "s" : ""}, à restaurer ou à effacer définitivement.` : "Aucune œuvre dans la corbeille."}</p>
        <button class="btn large" id="corbeille">Ouvrir la corbeille</button>
      </section>
      <section class="carte bloc" id="tarifs-port">
        <h2>Frais de port</h2>
        <p class="sous">Quatre tarifs, facturés à l'acheteur en plus du prix de l'œuvre. Le tarif se choisit dans la fiche de chaque œuvre. Modifier un montant ici ne change pas les ventes déjà enregistrées.</p>
        ${etat.tarifs.length ? `
        <div class="tarifs">
          <span class="lib" id="tp-col-lib">Libellé</span><span class="lib" id="tp-col-montant">Montant (€)</span>
          ${etat.tarifs.map((t) => `
            <input data-tarif="${t.cle}" data-quoi="libelle" value="${esc(t.libelle)}" maxlength="40" autocomplete="off" aria-labelledby="tp-col-lib">
            <input data-tarif="${t.cle}" data-quoi="montant" value="${esc(enSaisie(t.montant_eur))}" inputmode="decimal" autocomplete="off" aria-label="Montant en euros du tarif ${esc(t.libelle)}">`).join("")}
        </div>
        <div id="tp-erreur" role="alert"></div>
        <button class="btn plein large" id="tp-enregistrer" style="margin-top:14px">Enregistrer les tarifs</button>` : `<div class="message erreur">Les tarifs n'ont pas pu être chargés.</div>`}
      </section>
      <div id="reglages-certificats"></div>
      <h2 style="margin-top:22px">Champs des fiches</h2>
      ${etat.champs.map(carte).join("")}
      <section class="carte bloc">
        <h2>Ajouter un champ</h2>
        <label for="n-lib">Libellé</label>
        <input id="n-lib" placeholder="Par exemple : Lieu de stockage" autocomplete="off">
        <label for="n-type">Type</label>
        <select id="n-type">${Object.entries(TYPES).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select>
        <p class="sous">Le type ne peut plus être changé ensuite. Pour une liste, les choix s'ajoutent après la création.</p>
        <button class="btn plein large" id="n-ajouter">Ajouter le champ</button>
      </section>
    </div>`;
  $("#retour").addEventListener("click", vueListe);
  $("#corbeille").addEventListener("click", () => vueCorbeille());
  $("#revoir-tuto").addEventListener("click", () => lancerTutoriel());
  monterReglagesCertificats();
  const erreur = (m) => { $("#alerte").innerHTML = `<div class="message erreur">${m}</div>`; window.scrollTo(0, 0); };
  const verifier = (res) => { if (res.error) throw res.error; if (res.data && !res.data.length) throw new Error("Modification refusée : droits insuffisants."); };

  if ($("#tp-enregistrer")) {
    const zone = $("#tarifs-port");
    zone.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); e.stopPropagation(); $("#tp-enregistrer").click(); } });
    $("#tp-enregistrer").addEventListener("click", async () => {
      const refus = (m, el) => { $("#tp-erreur").innerHTML = `<div class="message erreur">${m}</div>`; el.focus(); };
      const maj = [];
      for (const t of etat.tarifs) {
        const elL = zone.querySelector(`[data-tarif="${t.cle}"][data-quoi="libelle"]`), elM = zone.querySelector(`[data-tarif="${t.cle}"][data-quoi="montant"]`);
        const libelle = texte(elL.value), m = texte(elM.value) ? nombre(elM.value) : 0;
        if (!libelle) return refus("Chaque tarif doit avoir un libellé.", elL);
        if (m === null || m < 0) return refus(`Le montant du tarif « ${esc(libelle)} » doit être un nombre, par exemple 25.`, elM);
        if (libelle !== t.libelle || m !== t.montant_eur) maj.push({ cle: t.cle, libelle, montant_eur: Math.round(m * 100) / 100 });
      }
      if (!maj.length) return vueAdmin("Aucun changement à enregistrer sur les tarifs.");
      const b = $("#tp-enregistrer"); b.disabled = true; b.setAttribute("aria-busy", "true"); b.textContent = "Enregistrement…";
      try {
        for (const { cle, ...valeurs } of maj) verifier(await sb.from("tarifs_port").update(valeurs).eq("cle", cle).select("cle"));
        vueAdmin("Tarifs de frais de port enregistrés.");
      } catch (e) { vueAdmin("Les tarifs n'ont pas tous été enregistrés : " + msgErreur(e), "erreur"); }
    });
  }

  $("#n-ajouter").addEventListener("click", async () => {
    const libelle = texte($("#n-lib").value);
    if (!libelle) return erreur("Indiquez un libellé pour le nouveau champ.");
    const ordre = Math.max(0, ...etat.champs.map((c) => c.ordre)) + 1;
    try {
      verifier(await sb.from("champs").insert({ libelle, type: $("#n-type").value, ordre }).select("id"));
      vueAdmin(`Champ « ${esc(libelle)} » ajouté.`);
    } catch (e) { erreur(msgErreur(e)); }
  });

  $("#adm").addEventListener("input", (e) => {
    const el = e.target.closest("[data-option]"); if (!el) return;
    const v = el.value.trim();
    el.parentElement.querySelector('[data-action="renommer"]').disabled = !v || v === el.dataset.initial;
  });
  $("#adm").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
    const b = e.target.id === "n-lib" ? $("#n-ajouter")
      : e.target.parentElement.querySelector('[data-action="renommer"]:not([disabled]), [data-action="libelle"], [data-action="ajouter"]');
    if (b) { e.preventDefault(); b.click(); }
  });
  $("#adm").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-action]"); if (!b) return;
    const bloc = b.closest("[data-champ]");
    const c = etat.champs.find((x) => x.id === bloc.dataset.champ);
    const action = b.dataset.action, i = Number(b.dataset.i);
    etat.adminOuvert = c.id;
    if (action === "retirer" || action === "supprimer") {
      const accord = await confirmer(action === "retirer"
        ? { titre: "Retirer ce choix ?", corps: `« ${c.options[i]} » ne sera plus proposé dans la liste « ${c.libelle} ». Les œuvres qui l'utilisent le conservent.`, action: "Retirer le choix" }
        : { titre: "Supprimer ce champ ?", corps: `Le champ « ${c.libelle} » disparaîtra de toutes les fiches.`, action: "Supprimer le champ" });
      if (!accord) return;
    }
    b.disabled = true;
    try {
      let ok = "";
      if (action === "libelle") {
        const v = texte($("#lib-" + c.id).value);
        if (!v) throw new Error("Le libellé ne peut pas être vide.");
        verifier(await sb.from("champs").update({ libelle: v }).eq("id", c.id).select("id"));
        ok = "Libellé enregistré.";
      } else if (action === "ajouter") {
        const v = texte($("[data-nouveau]", bloc).value);
        if (!v) throw new Error("Saisissez le nouveau choix.");
        if (c.options.includes(v)) throw new Error("Ce choix existe déjà.");
        verifier(await sb.from("champs").update({ options: [...c.options, v] }).eq("id", c.id).select("id"));
        ok = `Choix « ${v} » ajouté.`;
      } else if (action === "renommer") {
        const v = texte($(`[data-option="${i}"]`, bloc).value);
        if (!v) throw new Error("Le choix ne peut pas être vide.");
        if (v === c.options[i]) { b.disabled = false; return; }
        const res = await sb.rpc("renommer_option", { p_champ: c.id, p_ancien: c.options[i], p_nouveau: v });
        if (res.error) throw res.error;
        ok = `Choix renommé en « ${v} ». Œuvres mises à jour : ${res.data}.`;
      } else if (action === "retirer") {
        verifier(await sb.from("champs").update({ options: c.options.filter((_, k) => k !== i) }).eq("id", c.id).select("id"));
        ok = `Choix « ${c.options[i]} » retiré de la liste. Les œuvres qui l'utilisaient le conservent.`;
      } else if (action === "supprimer") {
        verifier(await sb.from("champs").delete().eq("id", c.id).select("id"));
        ok = `Champ « ${c.libelle} » supprimé.`;
      }
      vueAdmin(esc(ok));
    } catch (err) { b.disabled = false; erreur(msgErreur(err)); }
  });
}

/* ---------- Import en lot ---------- */
async function fichiersDejaImportes() {
  const noms = new Set();
  for (let debut = 0; ; debut += 1000) {
    const { data, error } = await sb.from("oeuvres").select("fichier_origine").not("fichier_origine", "is", null).order("id").range(debut, debut + 999);
    if (error) throw error;
    data.forEach((d) => noms.add(d.fichier_origine));
    if (data.length < 1000) break;
  }
  return noms;
}

function vueImport() {
  etat.gardien = null; etat.modifie = false; etat.retour = null; etat.section = "import"; arriver();
  document.body.classList.remove("barre-visible");
  window.scrollTo(0, 0);
  app.innerHTML = `
    ${entete("Import en lot")}
    <div class="carte etroit">
      <p>Sélectionnez plusieurs photos : une fiche « À compléter » est créée par photo, avec le nom du fichier comme titre provisoire.</p>
      <p class="sous">Les photos sont compressées avant l'envoi ; les originaux restent sur l'appareil. Un fichier dont le nom a déjà été importé est ignoré, ce qui permet de reprendre un import interrompu. Gardez cette page ouverte pendant l'import.</p>
      <label class="zone-photo" for="lot" id="zone">Choisir les photos</label>
      <input class="cache" id="lot" type="file" accept="image/*" multiple>
      <div id="suivi" hidden style="margin-top:16px">
        <progress id="barre" value="0" max="1"></progress>
        <p id="etatImport" aria-live="polite"></p>
        <ul class="journal" id="journal"></ul>
      </div>
      <button class="btn plein large" id="lancer" disabled style="margin-top:16px">Lancer l'import</button>
    </div>`;
  let enCours = false;
  $("#retour").addEventListener("click", () => { if (!enCours) vueListe(); });
  let fichiers = [];
  $("#lot").addEventListener("change", (e) => {
    fichiers = [...e.target.files];
    $("#zone").textContent = fichiers.length ? `${fichiers.length} photo${fichiers.length > 1 ? "s" : ""} sélectionnée${fichiers.length > 1 ? "s" : ""}` : "Choisir les photos";
    $("#lancer").disabled = !fichiers.length;
  });
  $("#lancer").addEventListener("click", async () => {
    if (enCours || !fichiers.length) return;
    enCours = true; etat.occupe = true; $("#lancer").disabled = true; $("#suivi").hidden = false; $("#journal").innerHTML = "";
    const maj = (t) => { $("#etatImport").textContent = t; };
    let faits = 0, ignores = 0, erreurs = 0, traites = 0;
    try {
      maj("Vérification des fichiers déjà importés…");
      const deja = await fichiersDejaImportes();
      const file = fichiers.filter((f) => { if (deja.has(f.name)) { ignores++; return false; } deja.add(f.name); return true; });
      const total = file.length; $("#barre").max = Math.max(1, total);
      const suivant = async () => {
        for (let f; (f = file.shift()); ) {
          try {
            const id = crypto.randomUUID();
            const chemins = await envoyerPhoto(id, f);
            const { error } = await sb.from("oeuvres").insert({ id, titre: f.name.replace(/\.[^.]+$/, "") || "Sans titre", fichier_origine: f.name, ...chemins });
            if (error) { await sb.storage.from(BUCKET).remove([chemins.photo_path, chemins.vignette_path]); throw error; }
            faits++;
          } catch (err) {
            erreurs++; const li = document.createElement("li"); li.textContent = `${f.name} : ${err.message || err}`; $("#journal").append(li);
          }
          traites++; $("#barre").value = traites;
          maj(`${traites} / ${total} traitées — ${faits} importées, ${erreurs} en erreur, ${ignores} déjà présentes`);
        }
      };
      await Promise.all([suivant(), suivant(), suivant()]);
      maj(`Import terminé : ${faits} importées, ${erreurs} en erreur, ${ignores} déjà présentes (ignorées).`);
    } catch (err) { maj("Import interrompu : " + (err.message || err)); }
    enCours = false; etat.occupe = false; fichiers = []; $("#lot").value = ""; $("#zone").textContent = "Choisir les photos";
  });
}

window.addEventListener("beforeunload", (e) => { if (etat.modifie || etat.occupe) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- Démarrage ---------- */
sb.auth.onAuthStateChange((evenement, session) => {
  if (evenement === "PASSWORD_RECOVERY") recuperation = true;
  if (evenement === "TOKEN_REFRESHED" || evenement === "USER_UPDATED") return;
  setTimeout(() => {
    if (recuperation && session) return vueNouveauMotDePasse();           // lien « mot de passe oublié » : on choisit d'abord le nouveau
    if (lienInvalide && !session) {                                         // lien expiré ou déjà utilisé
      lienInvalide = false; recuperation = false;
      try { history.replaceState(null, "", location.pathname); } catch (_) {}
      etat.utilisateur = null;
      return vueConnexion("Ce lien a expiré ou a déjà été utilisé. Pour un nouveau mot de passe, utilisez « Mot de passe oublié ? » ; pour confirmer un compte, connectez-vous simplement.");
    }
    demarrer(session);
  }, 0);
});
