<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f3f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Catalogue des œuvres — Pauline Bonneté</title>
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("polices/bricolage-grotesque.woff2") format("woff2-variations"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "Instrument Sans"; src: url("polices/instrument-sans.woff2") format("woff2-variations"); font-weight: 400 700; font-display: swap; }
  :root {
    /* Mur de galerie : blanc de cimaise, encre, gris de Payne, outremer pour agir, vermillon pour « vendu » */
    --fond: #f2f3f0; --carte: #ffffff; --encre: #171c26; --doux: #5b6472;
    --trait: #e1e3de; --accent: #3247d6; --accent-fonce: #2434a8; --accent-pale: #e9ecfc; --alerte: #c2301c; --vermillon: #d4351c; --port: #d98a00;
    --rayon: 16px; --ressort: cubic-bezier(.2, .8, .2, 1);
    --titre: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --texte: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    interpolate-size: allow-keywords;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--fond); color: var(--encre);
    font: 16px/1.45 var(--texte);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  h1 { font: 600 1.35rem/1.2 var(--titre); margin: 0; }
  h2 { font: 600 1.15rem/1.2 var(--titre); margin: 0 0 12px; }
  .page { max-width: 960px; margin: 0 auto; padding: 16px; }
  .entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sous { color: var(--doux); font-size: .9rem; }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea {
    width: 100%; padding: 12px; border: 1px solid var(--trait); border-radius: 10px;
    background: #fff; font-size: 16px;
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  label .opt { font-weight: 400; color: var(--doux); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--trait);
    background: #fff; cursor: pointer; font-weight: 600;
  }
  .btn.plein { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.plein:active { background: var(--accent-fonce); }
  .btn.danger { color: var(--alerte); border-color: #ebc4bd; }
  .btn.large { width: 100%; }
  .btn.lien { border: 0; background: none; min-height: 40px; padding: 0 6px; color: var(--accent); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 18px; }
  .message { padding: 12px 14px; border-radius: 10px; margin: 12px 0; font-size: .95rem; }
  .message.erreur { background: #fbeceb; color: var(--alerte); }
  .message.info { background: #eef0fc; color: #24307a; }
  .puces { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; margin: 10px 0 4px; scrollbar-width: none; }
  .puces::-webkit-scrollbar { display: none; }
  .puce {
    flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--trait);
    background: #fff; cursor: pointer; font-size: .9rem; white-space: nowrap;
  }
  .puce[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); color: #fff; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .oeuvre {
    display: block; text-align: left; padding: 0; border: 1px solid var(--trait); border-radius: var(--rayon);
    background: #fff; overflow: hidden; cursor: pointer;
  }
  .oeuvre img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #e9eae6; }
  .oeuvre .txt { padding: 8px 10px 10px; }
  .oeuvre .titre { font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oeuvre .meta { color: var(--doux); font-size: .8rem; display: flex; justify-content: space-between; gap: 6px; margin-top: 2px; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-top: 6px; }
  .s-a_completer { background: #fbf0cf; color: #6b4e00; }
  .s-disponible { background: #ddf2e3; color: #1e5b33; }
  .s-reserve { background: #ebe3f7; color: #4b2e83; }
  .s-vendu { background: #fadfd9; color: #8f2413; }
  .s-pas_a_vendre { background: #e7e8e4; color: #474c55; }
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .ligne {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px;
    border: 1px solid var(--trait); border-radius: var(--rayon); background: #fff; cursor: pointer;
  }
  .ligne img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: #e9eae6; }
  .ligne .corps { flex: 1; min-width: 0; }
  .ligne .titre { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ligne .infos { color: var(--doux); font-size: .85rem; }
  .ligne .droite { flex: none; text-align: right; font-size: .92rem; font-weight: 600; }
  .ligne .droite .badge { display: block; margin-top: 4px; font-weight: 600; }
  .bascule { display: flex; justify-content: flex-end; margin: 0 0 12px; }
  .segment { display: inline-flex; border: 1px solid var(--trait); border-radius: 10px; overflow: hidden; background: #fff; }
  .segment button {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px;
    border: 0; background: none; cursor: pointer; font-size: .88rem; color: var(--doux);
  }
  .segment button + button { border-left: 1px solid var(--trait); }
  .segment button[aria-pressed="true"] { background: var(--accent-pale); color: var(--accent-fonce); font-weight: 600; }
  .segment svg, .btn svg { width: 20px; height: 20px; flex: none; }
  .actions-entete { display: flex; align-items: center; gap: 2px; flex: none; }
  @media (max-width: 600px) { .txt-large { display: none; } .btn.lien.icone { min-width: 44px; min-height: 44px; } }
  .bloc { margin-bottom: 14px; }
  .rang { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .rang input { flex: 1; min-width: 120px; }
  .rang .btn { flex: none; padding: 0 12px; }
  .voile {
    position: fixed; inset: 0; z-index: 30; background: rgba(35,32,28,.6); padding: 16px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 600px) { .voile { align-items: center; } }
  .dialogue { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; margin-bottom: env(safe-area-inset-bottom); }
  .dialogue .tete { display: flex; gap: 14px; align-items: center; }
  .dialogue img, .corb img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; background: #e9eae6; }
  .dialogue h2 { margin: 0; }
  .bandeau {
    position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 20;
    max-width: 560px; margin: 0 auto; background: var(--encre); color: #fff; border-radius: 12px; padding: 8px 8px 8px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .95rem;
  }
  .bandeau button { color: #fff; background: none; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; min-height: 40px; padding: 0 14px; font-weight: 600; cursor: pointer; }
  .corb .tete { display: flex; gap: 14px; align-items: center; }
  .corb .rang .btn { flex: 1; }
  #lateral { display: none; }
  @media (min-width: 900px) {
    #lateral:not([hidden]) {
      display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; width: 256px; z-index: 5;
      background: #fff; border-right: 1px solid var(--trait); padding: 22px 12px 16px; overflow-y: auto;
    }
    body.avec-lateral { padding-left: 256px; }
    body.avec-lateral .barre-bas { left: 256px; }
    body.avec-lateral #puces, body.avec-lateral .actions-entete { display: none; }
  }
  .lat-marque { font: 600 1.15rem/1.2 var(--titre); padding: 0 10px; }
  .lat-sous { color: var(--doux); font-size: .82rem; padding: 2px 10px 14px; }
  .lat-titre { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); padding: 18px 10px 6px; }
  .lat-lien {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 40px;
    padding: 0 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; font-size: .93rem;
  }
  .lat-lien:hover:not([disabled]) { background: var(--fond); }
  .lat-lien[aria-current="page"] { background: var(--accent-pale); color: var(--accent-fonce); font-weight: 600; }
  .lat-lien[disabled] { color: var(--doux); cursor: default; }
  .lat-lien .n { flex: none; font-size: .8rem; font-weight: 400; color: var(--doux); }
  .lat-bas { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--trait); }
  .vide { text-align: center; color: var(--doux); padding: 40px 10px; }
  .barre-bas {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(242,243,240,.82);
    border-top: 1px solid var(--trait); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .barre-bas .contenu { max-width: 960px; margin: 0 auto; display: flex; gap: 10px; }
  .barre-bas .btn { flex: 1; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .apercu { width: 100%; max-height: 60vh; object-fit: contain; border-radius: var(--rayon); background: #e9eae6; display: block; }
  .zone-photo {
    display: flex; align-items: center; justify-content: center; text-align: center; min-height: 160px;
    border: 2px dashed var(--trait); border-radius: var(--rayon); color: var(--doux); padding: 16px; cursor: pointer; background: #fff;
  }
  .coche { display: flex; align-items: center; gap: 10px; font-weight: 400; font-size: .95rem; min-height: 44px; margin: 8px 0 0; cursor: pointer; }
  .coche input { width: 22px; height: 22px; flex: none; padding: 0; accent-color: var(--accent); }
  .cache { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  progress { width: 100%; height: 14px; accent-color: var(--accent); }
  ul.journal { padding-left: 18px; font-size: .88rem; color: var(--alerte); max-height: 200px; overflow: auto; }

  /* ---------- Ajustements UX ---------- */
  h1:focus { outline: none; }
  [hidden] { display: none !important; }
  .entete { min-height: 48px; }
  .entete .gauche { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .entete h1 { min-width: 0; }
  .btn.icone-seule { width: 44px; min-height: 44px; padding: 0; border: 0; background: none; border-radius: 10px; flex: none; }
  .btn.icone-seule:hover { background: rgba(35,32,28,.06); }
  .btn.icone-seule svg, .btn.icone-carree svg { width: 22px; height: 22px; }
  .btn.icone-carree { width: 48px; padding: 0; flex: none; }
  .btn.plein svg { width: 18px; height: 18px; }
  .entete .gauche .btn.icone-seule { margin-left: -10px; }
  .oeuvre { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
  .oeuvre:hover, .ligne:hover { border-color: #c5c9c1; }
  .ligne .infos { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .outils { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; min-height: 42px; }
  .actions-bureau { display: none; gap: 10px; flex: none; }
  .actions-bureau .btn { min-height: 44px; }
  .barre-bas { z-index: 4; }
  .barre-bas.mobile .btn:first-child, .barre-bas .contenu.fin .btn:first-child { flex: 0 0 auto; }
  .barre-bas .message { max-width: 960px; margin: 0 auto 8px; }
  .fiche { display: grid; gap: 14px; }
  .fiche .apercu { max-height: 42vh; }
  h2.section {
    font: 600 .76rem/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-transform: uppercase; letter-spacing: .06em;
    color: var(--doux); margin: 26px 0 0; padding-top: 18px; border-top: 1px solid var(--trait);
  }
  h2.section.premiere { border-top: 0; padding-top: 0; margin-top: 14px; }
  .req { color: var(--alerte); font-weight: 700; }
  .aide { color: var(--doux); font-size: .85rem; margin: 6px 0 0; }
  [aria-invalid="true"] { border-color: var(--alerte); background: #fff8f7; }
  .champ-court { max-width: 240px; }
  .zone-danger { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--trait); }
  .barre-bas .contenu.fin .outil, .barre-bas .contenu.fin #annuler { flex: 0 0 auto; }
  .barre-bas .contenu.fin .espace { display: none; }
  .btn.outil svg { width: 20px; height: 20px; }
  @media (max-width: 899px) { .btn.outil { width: 48px; padding: 0; } .btn.outil .long { display: none; } }
  .rang.option { flex-wrap: nowrap; }
  .rang.option input { min-width: 0; }
  details.champ > summary {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; min-height: 32px;
  }
  details.champ > summary::-webkit-details-marker { display: none; }
  details.champ > summary .nom { font-weight: 600; }
  details.champ > summary .sous::after { content: "▾"; display: inline-block; margin-left: 10px; transition: transform .15s; }
  details.champ[open] > summary .sous::after { transform: rotate(180deg); }
  details.champ[open] > summary { padding-bottom: 12px; border-bottom: 1px solid var(--trait); }
  .corb section.carte { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .corb .tete { flex: 1 1 240px; min-width: 0; }
  .corb .rang { flex: 0 1 auto; flex-wrap: nowrap; margin: 0; }
  .corb .rang .btn { flex: 1 1 auto; }
  .bandeau { min-height: 56px; }
  @media (max-width: 600px) { .corb .rang { flex: 1 1 100%; } }
  .pastille { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--vermillon); flex: none; }
  .oeuvre { position: relative; }
  .oeuvre .pastille { position: absolute; top: 10px; left: 10px; width: 16px; height: 16px; box-shadow: 0 0 0 2px #fff; }
  .titre .pastille { margin-right: 8px; }
  .bloc-vente { margin-top: 14px; padding: 14px; border-radius: 10px; background: #fdf3f0; border: 1px solid #f3d5cd; }
  .bloc-vente .deux label { margin-top: 0; }
  .tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 14px; }
  .tuile { background: #fff; border: 1px solid var(--trait); border-radius: var(--rayon); padding: 14px 16px; }
  .tuile .v { font: 600 1.5rem/1.2 var(--titre); }
  .tuile .l { color: var(--doux); font-size: .85rem; margin-top: 2px; }
  .commandes { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .commandes select { width: auto; min-height: 42px; padding: 8px 12px; }
  .graphe { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; }
  .graphe .ordonnees { display: flex; flex-direction: column; justify-content: space-between; height: 220px; text-align: right; color: var(--doux); font-size: .72rem; line-height: 1; }
  .graphe .ordonnees span:first-child { transform: translateY(-50%); }
  .graphe .ordonnees span:last-child { transform: translateY(50%); }
  .graphe .zone { position: relative; display: flex; align-items: flex-end; height: 220px; border-bottom: 1px solid #c5c9c1; }
  .graphe .trait { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--trait); pointer-events: none; }
  .graphe .col {
    position: relative; flex: 1 1 0; min-width: 0; height: 100%; padding: 0 1px; border: 0; background: none; cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .graphe .barre { width: 100%; max-width: 24px; display: flex; flex-direction: column; gap: 2px; }
  .graphe .seg { display: block; flex: 1 1 0; min-height: 2px; }
  .graphe .seg:first-child { border-radius: 4px 4px 0 0; }
  .graphe .seg.tab { background: var(--accent); }
  .graphe .seg.port { background: var(--port); }
  .graphe .col:hover .seg.tab, .graphe .col:focus-visible .seg.tab { background: var(--accent-fonce); }
  .graphe .col:hover .seg.port, .graphe .col:focus-visible .seg.port { background: #b87400; }
  .legende { display: flex; gap: 16px; margin: 0 0 16px; font-size: .82rem; color: var(--doux); }
  .legende span { display: inline-flex; align-items: center; gap: 6px; }
  .legende i, .port-ligne i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legende i.tab { background: var(--accent); } .legende i.port, .port-ligne i { background: var(--port); }
  .port-ligne { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .infobulle .detail { display: block; opacity: .8; }
  .outils-ventes { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px; align-items: center; }
  .outils-ventes #v-q { flex: 1 1 200px; min-width: 0; margin: 0; min-height: 42px; }
  .outils-ventes .btn { min-height: 42px; gap: 6px; }
  .outils-ventes .btn svg { width: 16px; height: 16px; }
  .outils-ventes .btn[aria-expanded="true"] { background: var(--accent-pale); border-color: var(--accent); color: var(--accent-fonce); }
  .outils-ventes select.tri { margin: 0; min-height: 42px; flex: 0 0 auto; }
  .pastille { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: #fff; font-size: .74rem; font-weight: 700; }
  .panneau-filtres { margin: 10px 10px 0; padding: 14px; border-radius: 14px; background: #f6f7f4; border: 1px solid var(--trait); animation: deplie .28s var(--ressort) both; }
  .grille-filtres { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
  .grille-filtres label { margin-top: 0; font-size: .82rem; }
  .grille-filtres input, .grille-filtres select { background-color: #fff; }
  .actions-filtres { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .actifs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 10px 0; }
  .actif { display: inline-flex; align-items: center; gap: 2px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--accent-pale); color: var(--accent-fonce); font-size: .84rem; font-weight: 550; }
  .actif button { display: grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; }
  .actif button:hover { background: rgba(50,71,214,.16); }
  .actif button svg { width: 14px; height: 14px; }
  .vide-filtre { padding: 26px 10px; text-align: center; color: var(--doux); }
  .vide-filtre p { margin: 0 0 12px; }
  .grille-filtres > div { min-width: 0; }
  .grille-filtres input, .grille-filtres select { width: 100%; min-width: 0; }
  @media (max-width: 600px) {
    .grille-filtres { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .grille-filtres input[type=date] { padding-left: 8px; padding-right: 6px; font-size: .9rem; }
    .actions-filtres .btn { flex: 1 1 0; }
    .outils-ventes #v-q { flex: 1 1 100%; }
    .outils-ventes .btn, .outils-ventes select.tri { flex: 1 1 0; min-width: 0; }
  }
  .tarifs { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px 10px; align-items: center; margin-top: 12px; }
  .tarifs .lib { font-size: .85rem; font-weight: 600; }
  .tarifs input { margin: 0; }
  .graphe.filtre .col[aria-pressed="false"] .barre { opacity: .4; }
  .graphe .col:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
  .graphe .abscisses { grid-column: 2; display: flex; padding-top: 6px; color: var(--doux); font-size: .72rem; }
  .graphe .abscisses span { flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; }
  .graphe .court { display: none; }
  .infobulle {
    position: absolute; z-index: 2; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
    background: var(--encre); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: .8rem; line-height: 1.3;
  }
  .infobulle strong { display: block; font-size: .95rem; }
  .vente { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px; border: 0; border-top: 1px solid var(--trait); background: none; cursor: pointer; }
  .vente:first-child { border-top: 0; }
  .vente:hover { background: var(--fond); }
  .vente img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; flex: none; background: #e9eae6; }
  .vente .corps { flex: 1; min-width: 0; }
  .vente .titre { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vente .droite { flex: none; text-align: right; }
  .vente .montant { font-weight: 600; }
  .manque { color: #8a5200; font-weight: 600; }
  .vente .droite .sous, .vente .corps .sous { font-size: .82rem; }
  @media (max-width: 600px) { .tuiles { grid-template-columns: 1fr 1fr; } .tuile:first-child { grid-column: 1 / -1; } .vente .long { display: none; } .vente { padding: 10px 8px; gap: 10px; } }
  @media (max-width: 600px) { .graphe .long { display: none; } .graphe .court { display: inline; } .entete h1 { font-size: 1.22rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (min-width: 900px) {
    .page { max-width: 1100px; padding: 24px 32px; }
    .etroit { max-width: 760px; }
    body.avec-lateral .actions-bureau { display: flex; }
    body.avec-lateral .barre-bas.mobile { display: none; }
    body.avec-lateral .bandeau { left: 272px; bottom: 24px; }
    body.avec-lateral.barre-visible .bandeau { bottom: 92px; }
    .barre-bas .contenu, .barre-bas .message { max-width: 1036px; }
    .barre-bas .contenu.fin { justify-content: flex-end; }
    .barre-bas .contenu.fin .btn { flex: 0 0 auto; min-width: 170px; }
    .barre-bas .contenu.fin .btn.outil { min-width: 0; }
    .barre-bas .contenu.fin .espace { display: block; flex: 1; }
    .fiche { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); align-items: start; gap: 20px; }
    .colonne-photo { position: sticky; top: 24px; }
    .fiche .apercu { max-height: 60vh; }
    .grille { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .vide { padding: 64px 10px; }
  }

  /* ================= Direction artistique ================= */
  body { font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1 { font: 700 1.5rem/1.15 var(--titre); letter-spacing: -.02em; }
  h2 { font: 650 1.1rem/1.2 var(--titre); letter-spacing: -.01em; }
  h2.section { font: 600 .95rem/1.3 var(--texte); text-transform: none; letter-spacing: 0; color: var(--encre); }
  .lat-titre { text-transform: none; letter-spacing: 0; font-size: .8rem; }
  .carte { border: 0; box-shadow: 0 0 0 1px rgba(23,28,38,.06), 0 1px 2px rgba(23,28,38,.04), 0 8px 24px -16px rgba(23,28,38,.18); }
  label { font-weight: 600; }

  /* Champs */
  input, select, textarea { border-radius: 12px; border-color: #d6d9d2; transition: border-color .15s, box-shadow .15s, background-color .15s; }
  input:hover, select:hover, textarea:hover { border-color: #b9bdb4; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(50,71,214,.16); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [aria-invalid="true"], [aria-invalid="true"]:focus { border-color: var(--alerte); box-shadow: 0 0 0 4px rgba(194,48,28,.14); }
  input[type="search"] { border-radius: 999px; padding-left: 18px; }
  .coche input { accent-color: var(--accent); border-radius: 6px; box-shadow: none; }

  /* Boutons : pastilles pleines, retour tactile, relief au survol */
  .btn {
    border-radius: 999px; border-color: #d6d9d2; padding: 0 20px;
    transition: transform .18s var(--ressort), box-shadow .18s var(--ressort), background-color .15s, border-color .15s, color .15s;
  }
  .btn:hover:not([disabled]) { border-color: #a9aea3; background: #fafbf9; }
  .btn:active:not([disabled]) { transform: scale(.97); }
  .btn.plein { background: var(--accent); border-color: var(--accent); box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 6px 14px -8px rgba(50,71,214,.7); }
  .btn.plein:hover:not([disabled]) { background: var(--accent-fonce); border-color: var(--accent-fonce); transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 12px 22px -10px rgba(50,71,214,.75); }
  .btn.plein:active:not([disabled]) { transform: translateY(0) scale(.97); box-shadow: 0 2px 6px -4px rgba(50,71,214,.6); }
  .btn.plein svg { transition: transform .35s var(--ressort); }
  .btn.plein:hover svg { transform: rotate(90deg); }
  .btn.plein.outil:hover svg { transform: none; }
  .btn.plein.vert { background: #1f7a46; border-color: #1f7a46; box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 6px 14px -8px rgba(31,122,70,.7); }
  .btn.plein.vert:hover:not([disabled]) { background: #17603a; border-color: #17603a; box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 12px 22px -10px rgba(31,122,70,.75); }
  .btn.plein.vert:active:not([disabled]) { box-shadow: 0 2px 6px -4px rgba(31,122,70,.6); }
  .btn.danger:hover:not([disabled]) { background: #fdf3f0; border-color: var(--alerte); }
  .btn.icone-seule, .btn.icone-carree { padding: 0; }
  .btn.icone-carree { border-radius: 12px; }
  .btn.lien { color: var(--accent); }
  .btn[aria-busy="true"]::before {
    content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
    animation: tourne .7s linear infinite;
  }
  @keyframes tourne { to { transform: rotate(360deg); } }

  /* Filtres et sélecteur d'affichage */
  .puce { transition: background-color .15s, color .15s, border-color .15s, transform .18s var(--ressort); border-color: #d6d9d2; display: inline-flex; align-items: center; gap: 8px; }
  .puce:active { transform: scale(.96); }
  .puce .n { font-size: .78rem; color: var(--doux); font-variant-numeric: tabular-nums; }
  .puce[aria-pressed="true"] .n { color: rgba(255,255,255,.72); }
  /* Sélecteur à bascule : une glissière grise et une touche blanche en relief, sans rapport avec les pastilles de filtre */
  .segment { border: 0; border-radius: 10px; padding: 3px; gap: 2px; background: #e2e4df; }
  .segment button { border-radius: 7px; min-height: 34px; padding: 0 14px; color: var(--doux); transition: background-color .18s, color .18s, box-shadow .18s; }
  .segment button + button { border-left: 0; }
  .segment button:hover { color: var(--encre); }
  .segment button[aria-pressed="true"] { background: #fff; color: var(--encre); font-weight: 600; box-shadow: 0 1px 2px rgba(23,28,38,.2), 0 0 0 1px rgba(23,28,38,.04); }
  .segment.icones button { width: 42px; padding: 0; justify-content: center; }
  .segment.icones .lib { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Œuvres : accrochées au mur, sous passe-partout, avec leur cartel */
  .grille { gap: 22px 16px; }
  .oeuvre { border: 0; background: none; overflow: visible; border-radius: 0; }
  .oeuvre .cadre {
    aspect-ratio: 1; display: grid; place-items: center; padding: 9%; background: #fff; border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(23,28,38,.07), 0 1px 1px rgba(23,28,38,.06), 0 10px 20px -12px rgba(23,28,38,.35);
    transition: transform .3s var(--ressort), box-shadow .3s var(--ressort);
  }
  .oeuvre .cadre img { width: 100%; height: 100%; aspect-ratio: 1; object-fit: cover; background: #e9eae6; box-shadow: 0 0 0 1px rgba(23,28,38,.1), 0 1px 3px rgba(23,28,38,.25); }
  .oeuvre:hover .cadre, .oeuvre:focus-visible .cadre { transform: translateY(-4px); box-shadow: 0 0 0 1px rgba(23,28,38,.07), 0 2px 2px rgba(23,28,38,.05), 0 22px 30px -16px rgba(23,28,38,.42); }
  .oeuvre:active .cadre { transform: translateY(-1px) scale(.99); }
  .oeuvre .txt { padding: 12px 2px 0; }
  .oeuvre .titre { font-size: .95rem; }
  .oeuvre .pastille { position: static; width: 10px; height: 10px; box-shadow: none; }
  .pastille { width: 10px; height: 10px; }
  .badge { font-weight: 600; letter-spacing: .01em; }
  .ligne { border: 0; box-shadow: 0 0 0 1px rgba(23,28,38,.06), 0 1px 2px rgba(23,28,38,.04); transition: box-shadow .2s, transform .2s var(--ressort); }
  .ligne:hover { box-shadow: 0 0 0 1px rgba(23,28,38,.1), 0 10px 20px -14px rgba(23,28,38,.3); transform: translateY(-1px); }
  .ligne img { border-radius: 4px; }
  img.fondu { opacity: 0; transition: opacity .4s ease; }
  img.fondu.pret { opacity: 1; }
  .squelette { border-radius: 3px; aspect-ratio: 1; background: linear-gradient(100deg, #e6e8e3 40%, #f1f2ef 50%, #e6e8e3 60%) 0 0 / 300% 100%; animation: miroite 1.4s linear infinite; }
  .liste .squelette { aspect-ratio: auto; height: 80px; border-radius: var(--rayon); }
  @keyframes miroite { to { background-position: -150% 0; } }

  /* Sélection multiple */
  .outils-droite { display: flex; align-items: center; gap: 8px; flex: none; }
  .outils { flex-wrap: wrap; row-gap: 6px; }
  .outils #resume { flex: 1 1 100%; }
  .outils-droite { flex: 1 1 100%; min-width: 0; justify-content: flex-end; gap: 4px; }
  .outils-droite .btn.discret { padding: 0 10px; }
  select.tri { width: auto; flex: 0 1 172px; min-width: 0; margin-right: auto; min-height: 38px; padding: 6px 24px 6px 11px; font-size: .84rem; font-weight: 550; border-radius: 999px; background-color: #fff; cursor: pointer; text-overflow: ellipsis; }
  @media (min-width: 720px) {
    .outils { flex-wrap: nowrap; }
    .outils #resume { flex: 1 1 auto; }
    .outils-droite { flex: none; gap: 8px; }
    .outils-droite .btn.discret { padding: 0 14px; }
    select.tri { margin-right: 0; flex: none; font-size: .88rem; padding: 6px 30px 6px 14px; }
  }
  .btn.discret { min-height: 38px; padding: 0 14px; font-size: .88rem; border-color: transparent; background: none; color: var(--accent); }
  .btn.discret:hover:not([disabled]) { background: var(--accent-pale); border-color: transparent; }
  .coche-sel {
    display: none; place-items: center; width: 26px; height: 26px; border-radius: 8px; flex: none; color: transparent;
    background: #fff; border: 2px solid #aeb3a9; transition: background-color .15s, border-color .15s, transform .2s var(--ressort);
  }
  .coche-sel svg { width: 16px; height: 16px; stroke-width: 3; }
  .selection .coche-sel { display: grid; }
  .oeuvre .coche-sel { position: absolute; top: 8px; left: 8px; z-index: 1; box-shadow: 0 2px 6px rgba(23,28,38,.25); }
  .choisie .coche-sel { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.06); }
  .oeuvre.choisie .cadre { box-shadow: 0 0 0 3px var(--accent), 0 10px 20px -12px rgba(23,28,38,.35); }
  .ligne.choisie { box-shadow: 0 0 0 2px var(--accent); background: #fbfbff; }
  .selection .oeuvre:hover .cadre { transform: none; }
  .barre-bas .contenu.sel { flex-wrap: wrap; align-items: center; }
  .barre-bas .contenu.sel .rappel { display: flex; align-items: center; gap: 6px; flex: 1 1 100%; min-width: 0; }
  .barre-bas .contenu.sel .rappel strong { flex: 1; }
  .barre-bas .contenu.sel .btn.icone-seule, .barre-bas .contenu.sel .btn.discret { flex: none; }
  .barre-bas .contenu.sel .btn { white-space: nowrap; }
  .barre-bas .contenu.sel .btn.icone-carree { flex: none; width: 46px; min-height: 46px; border-radius: 12px; }
  .actions-lot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1 1 100%; }
  .actions-lot .btn { min-height: 44px; padding: 0 12px; font-size: .92rem; }
  @media (max-width: 600px) { .contenu.sel .long { display: none; } }
  body.sel { padding-bottom: calc(210px + env(safe-area-inset-bottom)); }
  .dialogue.large { max-width: 460px; }
  .dialogue .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  @media (min-width: 900px) {
    .barre-bas .contenu.sel { flex-wrap: nowrap; }
    .barre-bas .contenu.sel .rappel { flex: 1 1 auto; }
    .barre-bas .contenu.sel .rappel { display: contents; }
    .actions-lot { display: flex; flex: 0 1 auto; flex-wrap: wrap; justify-content: flex-end; order: 1; }
    .actions-lot .btn { flex: 0 0 auto; padding: 0 16px; }
    .barre-bas .contenu.sel #sel-corbeille { order: 2; }
    body.sel { padding-bottom: 130px; }
  }

  /* Certificats */
  .fiche-cert { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 8px 16px; align-items: baseline; }
  .actions-cert { display: flex; flex-wrap: wrap; gap: 10px; }
  .tete-cert { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .tete-cert img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; flex: none; background: #e9eae6; }
  .signature-apercu { display: grid; place-items: center; min-height: 96px; margin: 10px 0; padding: 12px; border-radius: 12px; border: 1px dashed #c9cdc4; background: #fff; }
  .signature-apercu img { max-width: 100%; max-height: 110px; }
  #liste-certificats .vente .droite .badge { margin-bottom: 4px; }
  @media (max-width: 600px) { .actions-cert .btn { flex: 1 1 100%; } }

  /* Écran de connexion : une œuvre en fond, sur tout l'écran */
  .accueil { position: relative; min-height: calc(100dvh - 130px); display: grid; align-content: center; justify-items: center; }
  .accueil-fond { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: center / cover no-repeat; opacity: 0; transition: opacity 1.2s ease; }
  .accueil-fond.pret { opacity: 1; }
  .accueil-fond::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(23,28,38,.10), rgba(23,28,38,.28)); }
  .accueil-fond .rogne { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .rogne { position: relative; overflow: hidden; }
  .rogne img { position: absolute; max-width: none; height: auto; }
  .accueil-carte { position: relative; z-index: 1; width: 100%; max-width: 420px; box-shadow: 0 0 0 1px rgba(23,28,38,.08), 0 30px 70px -20px rgba(10,14,24,.7); animation: monte .6s var(--ressort) both; }
  .accueil.avec-oeuvre .accueil-carte { background: rgba(255,255,255,.93); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }

  /* Tutoriel de prise en main */
  .tuto-fond { position: fixed; inset: 0; z-index: 50; }
  .tuto-halo {
    position: fixed; z-index: 51; pointer-events: none; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(16,19,26,.66), 0 0 0 2px #fff;
    transition: left .35s var(--ressort), top .35s var(--ressort), width .35s var(--ressort), height .35s var(--ressort);
  }
  .tuto-halo.sans-cible { left: 50% !important; top: 50% !important; width: 0 !important; height: 0 !important; box-shadow: 0 0 0 9999px rgba(16,19,26,.66); }
  .tuto-carte {
    position: fixed; z-index: 52; width: min(380px, calc(100vw - 32px)); padding: 18px 20px 16px; background: #fff; border-radius: 18px;
    box-shadow: 0 30px 60px -20px rgba(10,14,24,.6); animation: monte .3s var(--ressort) both;
  }
  .tuto-carte[data-pos="centre"] { left: 50%; top: 50%; transform: translate(-50%, -50%); animation: none; }
  .tuto-carte[data-pos="bas"] { left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: auto; }
  .tuto-carte[data-pos="haut"] { left: 16px; right: 16px; top: calc(16px + env(safe-area-inset-top)); width: auto; }
  .tuto-avancement { display: flex; gap: 4px; margin-bottom: 12px; }
  .tuto-avancement span { flex: 1; height: 4px; border-radius: 2px; background: #e2e4df; transition: background-color .3s; }
  .tuto-avancement span.fait { background: #a9b3ee; }
  .tuto-avancement span.actif { background: var(--accent); }
  .tuto-etape { font-size: .8rem; color: var(--doux); font-variant-numeric: tabular-nums; }
  .tuto-carte h2 { margin: 2px 0 6px; font-size: 1.2rem; }
  .tuto-carte p { margin: 0 0 16px; color: #3c424e; }
  .tuto-actions { display: flex; align-items: center; gap: 8px; }
  .tuto-actions .btn { min-height: 42px; padding: 0 16px; white-space: nowrap; }
  .tuto-actions .btn.discret { margin-left: -12px; padding: 0 12px; }
  body.tuto-ouvert { overflow: hidden; }

  /* Éditeur de photo */
  body.editeur-ouvert { overflow: hidden; }
  .editeur { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #10131a; color: #fff; animation: voile .2s ease both; }
  .editeur-tete { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: calc(14px + env(safe-area-inset-top)) 18px 10px; }
  .editeur-tete strong { font: 700 1.1rem/1.2 var(--titre); }
  .editeur-aide { color: rgba(255,255,255,.62); font-size: .85rem; }
  .editeur-zone { flex: 1; min-height: 0; padding: 14px 24px 18px; } /* marge : les poignées restent saisissables au bord de l'écran */
  .editeur-zone img { display: block; max-width: 100%; max-height: 100%; }
  .editeur-outils { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #171b24; border-top: 1px solid rgba(255,255,255,.1); }
  .editeur-groupe { display: flex; align-items: center; gap: 8px; }
  .editeur-groupe.fin { margin-left: auto; }
  .editeur-groupe.fin .btn { min-height: 46px; }
  .editeur-groupe.fin .btn:not(.plein) { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
  .ed-btn { display: inline-grid; place-items: center; min-width: 46px; min-height: 46px; padding: 0 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #fff; cursor: pointer; transition: background-color .15s; }
  .ed-btn:hover { background: rgba(255,255,255,.16); }
  .ed-btn svg { width: 22px; height: 22px; }
  .ed-btn.texte { font-size: .88rem; padding: 0 14px; }
  .ed-segment { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: rgba(255,255,255,.1); }
  .ed-segment button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: rgba(255,255,255,.75); cursor: pointer; font-size: .88rem; }
  .ed-segment button[aria-pressed="true"] { background: #fff; color: var(--encre); font-weight: 600; }
  .editeur .cropper-view-box { outline: 2px solid #fff; outline-color: #fff; }
  .editeur .cropper-point { width: 14px; height: 14px; background: #fff; opacity: 1; border-radius: 50%; }
  .editeur .cropper-point.point-se { width: 14px; height: 14px; }
  .editeur .cropper-line { background: transparent; }
  .editeur .cropper-modal { background: #10131a; opacity: .72; }
  @media (max-width: 600px) {
    .editeur-aide { display: none; }
    .editeur-outils { justify-content: center; }
    .editeur-groupe.fin { margin-left: 0; flex: 1 1 100%; }
    .editeur-groupe.fin .btn { flex: 1; }
    .editeur .cropper-point { width: 20px; height: 20px; }
  }

  /* Navigation latérale */
  #lateral { box-shadow: 1px 0 0 var(--trait); border-right: 0; }
  .lat-marque { font: 700 1.3rem/1.1 var(--titre); letter-spacing: -.02em; }
  .lat-lien { border-radius: 10px; transition: background-color .15s, color .15s; position: relative; }
  .lat-lien > span:first-child { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .lat-lien svg { width: 18px; height: 18px; flex: none; color: var(--doux); }
  .lat-lien .point { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 5px; }
  .lat-lien[aria-current="page"] { background: var(--accent-pale); color: var(--accent-fonce); }
  .lat-lien[aria-current="page"] svg { color: var(--accent-fonce); }
  .lat-lien .n { font-variant-numeric: tabular-nums; }
  .lat-lien .bientot { white-space: nowrap; font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: #eceee9; color: var(--doux); }

  /* Barres d'actions, fenêtres, bandeaux */
  .barre-bas { -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-top-color: rgba(23,28,38,.08); }
  .voile { animation: voile .2s ease both; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); background: rgba(23,28,38,.45); }
  .dialogue { border-radius: 22px; animation: monte .32s var(--ressort) both; box-shadow: 0 30px 60px -20px rgba(23,28,38,.5); }
  .dialogue img { border-radius: 4px; }
  .bandeau { border-radius: 999px; padding: 6px 6px 6px 20px; animation: monte .35s var(--ressort) both; box-shadow: 0 14px 30px -12px rgba(23,28,38,.55); }
  .bandeau button { border-radius: 999px; transition: background-color .15s; }
  .bandeau button:hover { background: rgba(255,255,255,.14); }

function lireDate(v) {

/* Redimensionne une photo dans le navigateur : version d'affichage + vignette (JPEG). */
async function preparerPhoto(fichier) {
  let source;
  try {
    source = await createImageBitmap(fichier, { imageOrientation: "from-image" });
  } catch (_) {
    source = await new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => ko(new Error("Format d'image non lisible par ce navigateur : " + fichier.name));
      img.src = URL.createObjectURL(fichier);
    });
  }
  const l0 = source.width, h0 = source.height;
  const reduire = (max, qualite) => new Promise((ok, ko) => {
    const r = Math.min(1, max / Math.max(l0, h0));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(l0 * r)); c.height = Math.max(1, Math.round(h0 * r));
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(source, 0, 0, c.width, c.height);
    c.toBlob((b) => b ? ok(b) : ko(new Error("Compression impossible : " + fichier.name)), "image/jpeg", qualite);
  });
  const grand = await reduire(1600, 0.82);
  const petit = await reduire(480, 0.75);
  if (source.close) source.close();
  return { grand, petit };
}

async function envoyerPhoto(id, fichier) {

  const t = Date.now();

  for (const [chemin, blob] of [[photo_path, grand], [vignette_path, petit]]) {

/* Fenêtre de confirmation : « Annuler » en bouton principal, action dangereuse inactive 2 secondes. */
function confirmer({ titre, corps, vignette, action, annuler = "Annuler", delai = 2, ton = "danger" }) {
  return new Promise((resoudre) => {
    const voile = document.createElement("div"); voile.className = "voile";
    voile.innerHTML = `
      <div class="dialogue" role="alertdialog" aria-modal="true" aria-labelledby="dlg-titre" aria-describedby="dlg-corps">
        <div class="tete">${vignette ? `<img alt="" src="${esc(vignette)}">` : ""}<h2 id="dlg-titre">${esc(titre)}</h2></div>
        <p id="dlg-corps">${esc(corps)}</p>
        <div style="display:grid;gap:10px">
          <button class="btn ${ton === "neutre" ? "" : "plein"} large" data-r="non">${esc(annuler)}</button>
          <button class="btn ${ton === "neutre" ? "plein" : "danger"} large" data-r="oui" ${delai ? "disabled" : ""}>${esc(action)}${delai ? ` (${delai})` : ""}</button>
        </div>
      </div>`;
    document.body.append(voile);
    const oui = voile.querySelector('[data-r="oui"]');
    let reste = delai;
    const minuterie = setInterval(() => {
      reste--;
      if (reste > 0) oui.textContent = `${action} (${reste})`;
      else { clearInterval(minuterie); oui.textContent = action; oui.disabled = false; }
    }, 1000);
    const clavier = (e) => { if (e.key === "Escape") fermer(false); };
    const fermer = (r) => { clearInterval(minuterie); document.removeEventListener("keydown", clavier); voile.remove(); resoudre(r); };
    document.addEventListener("keydown", clavier);
    voile.addEventListener("click", (e) => {
      if (e.target === voile) return fermer(false);
      const b = e.target.closest("[data-r]"); if (b && !b.disabled) fermer(b.dataset.r === "oui");
    });
    voile.querySelector('[data-r="non"]').focus();
  });
}

      fond.innerHTML = `<div class="rogne" style="aspect-ratio:${rogne.l}/${rogne.h};width:max(100vw, calc(100vh * ${rogne.l / rogne.h}))"><img alt="" src="${esc(adresse)}" style="${style}"></div>`;
    } else fond.style.backgroundImage = `url("${adresse}")`;
    fond.classList.add("pret"); $("#accueil").classList.add("avec-oeuvre");
  };
  const essayer = (adresse, alors, sinon) => { const i = new Image(); i.onload = alors; i.onerror = sinon; i.src = adresse; };
  const choisie = urlPhoto(ACCUEIL_CHOISIE) + "?v=" + Math.floor(Date.now() / 600000), defaut = urlPhoto(ACCUEIL_DEFAUT.chemin);
  essayer(choisie, () => poser(choisie, null), () => essayer(defaut, () => poser(defaut, ACCUEIL_DEFAUT), () => {}));
}

  $("#voir").addEventListener("change", (e) => { $("#mdp").type = e.target.checked ? "text" : "password"; });
  $("#oubli").addEventListener("click", () => vueMotDePasseOublie($("#email").value.trim()));

    if (!data.session) vueConnexion("Compte créé. Un e-mail de confirmation vient de vous être envoyé : cliquez sur le lien qu'il contient, puis revenez vous connecter ici.", "info");

function gabaritAccueil(interieur) {
  masquerLateral();
  app.innerHTML = `
    <div class="accueil" id="accueil">

}
const erreurAuth = (e) => {
  const m = (e && e.message) || "";
  if ((e && e.status === 429) || /rate limit|security purposes/i.test(m)) return "Trop de demandes en peu de temps. Patientez quelques minutes avant de réessayer.";
  if (/different from the old password/i.test(m)) return "Le nouveau mot de passe doit être différent de l'ancien.";
  if (/at least \d+ characters|weak/i.test(m)) return "Ce mot de passe est trop court ou trop simple. Choisissez-en un d'au moins 8 caractères.";
  if (/session.*missing|not authenticated|jwt/i.test(m)) return "Ce lien n'est plus valable. Demandez-en un nouveau avec « Mot de passe oublié ? ».";
  return msgErreur(e);
};

function vueMotDePasseOublie(emailInitial = "", message = "", type = "erreur") {

      <div role="alert">${message ? `<div class="message ${type}">${message}</div>` : ""}</div>
      <form id="f">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" required value="${esc(emailInitial)}">

    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return vueMotDePasseOublie(email, erreurAuth(error));
    // Même message qu'un compte existe ou non : on ne révèle pas quelles adresses ont un compte
    vueMotDePasseOublie(email, "Si un compte existe pour cette adresse, un e-mail vient de lui être envoyé. Ouvrez-le et cliquez sur le lien sans trop attendre : il n'est valable qu'un temps limité. Pensez à regarder dans les indésirables.", "info");

async function demarrer(session) {
  if (!session) { etat.utilisateur = null; return vueConnexion(); }
  if (etat.utilisateur === session.user.id) return;
  etat.utilisateur = session.user.id;
  const { data, error } = await sb.from("membres").select("email,admin,tutoriel_vu").limit(1);
  if (error) return vueConnexion(msgErreur(error));
  if (!data.length) return vueNonAutorise(session.user.email);
  etat.admin = !!data[0].admin; etat.email = data[0].email; etat.tutorielVu = data[0].tutoriel_vu !== false;
  try { await chargerChamps(); } catch (_) { etat.champs = []; }
  try { await chargerTarifs(); } catch (_) { etat.tarifs = []; }
  vueListe();
  if (!etat.tutorielVu) setTimeout(() => { if (etat.utilisateur && !etat.tutorielVu) lancerTutoriel(); }, 1200); // première connexion
}

/* ---------- Liste ---------- */
function filtrer(req) {
  req = req.is("supprime_le", null);
  if (etat.statut) req = req.eq("statut", etat.statut);
  const q = etat.q.replace(/[,()%*\\"]/g, " ").trim();
  if (q) req = req.or(["titre", "serie", "technique", "support"].map((c) => `${c}.ilike."%${q}%"`).join(","));
  return req;
}

async function chargerComptes() {
  const cles = ["", ...Object.keys(STATUTS)];
  const res = await Promise.all(cles.map((s) => {
    let r = sb.from("oeuvres").select("id", { count: "exact", head: true }).is("supprime_le", null);
    return s ? r.eq("statut", s) : r;
  }));
  cles.forEach((s, i) => { if (s) etat.comptes[s] = res[i].count ?? 0; else etat.total_general = res[i].count ?? 0; });
  if (etat.admin) {
    const { count } = await sb.from("oeuvres").select("id", { count: "exact", head: true }).not("supprime_le", "is", null);
    etat.enCorbeille = count ?? 0;
  }
}

async function chargerPage(reinitialiser, jeton = etat.jeton) {
  const page = reinitialiser ? 0 : etat.page, debut = page * PAGE;
  const { data, count, error } = await filtrer(
    sb.from("oeuvres").select("id,titre,statut,prix_eur,vignette_path,technique,support,annee,hauteur_cm,largeur_cm", { count: "exact" })
  ).order(TRIS[etat.tri][1], { ascending: TRIS[etat.tri][2], nullsFirst: false }).order("id").range(debut, debut + PAGE - 1);
  if (error) throw error;
  if (jeton !== etat.jeton) return; // réponse périmée : une recherche plus récente est en cours
  if (reinitialiser) etat.items = [];
  etat.items.push(...data); etat.total = count ?? etat.items.length; etat.page = page + 1;
}

async function rafraichirListe(avecComptes, pages = 1) {
  const jeton = ++etat.jeton;
  try {
    await Promise.all([chargerPage(true, jeton), avecComptes ? chargerComptes() : null]);
    while (jeton === etat.jeton && etat.page < pages && etat.items.length < etat.total) await chargerPage(false, jeton);
    if (jeton !== etat.jeton) return;
    dessinerPuces(); dessinerGrille(); majLateral();
  } catch (e) { if ($("#grille")) $("#grille").innerHTML = `<div class="message erreur" style="grid-column:1/-1">${msgErreur(e)}</div>`; }
}

/* ---------- Sélection multiple et actions en lot ---------- */
function majSelection() {
  const zone = $("#grille"), barre = $("#barre-selection"); if (!zone || !barre) return;
  const actif = !!etat.selection, n = actif ? etat.selection.size : 0;
  zone.classList.toggle("selection", actif);
  zone.querySelectorAll("[data-id]").forEach((b) => {
    const choisie = actif && etat.selection.has(b.dataset.id);
    b.classList.toggle("choisie", choisie);
    if (actif) b.setAttribute("aria-pressed", String(choisie)); else b.removeAttribute("aria-pressed");
  });
  barre.hidden = !actif; app.querySelector(".barre-bas.mobile").hidden = actif; $("#sel-entrer").hidden = actif;
  document.body.classList.toggle("sel", actif);

async function parLots(ids, action) {
  for (let i = 0; i < ids.length; i += 150) { const { error } = await action(ids.slice(i, i + 150)); if (error) throw error; }
}

async function selectionCorbeille() {
  const ids = [...etat.selection], n = ids.length, pl = n > 1 ? "s" : "";
  const accord = await confirmer({
    titre: `Mettre ${n} œuvre${pl} à la corbeille ?`,
    corps: `${n > 1 ? "Elles seront retirées" : "Elle sera retirée"} du catalogue. Un administrateur pourra ${n > 1 ? "les" : "la"} restaurer depuis la corbeille.`,
    action: "Mettre à la corbeille"
  });
  if (!accord) return;
  try {
    const quand = new Date().toISOString();
    await parLots(ids, (lot) => sb.from("oeuvres").update({ supprime_le: quand }).in("id", lot));
  } catch (e) { vueListe(); return bandeau("La mise à la corbeille a échoué : " + (e.message || e)); }
  vueListe();
  bandeau(`${n} œuvre${pl} placée${pl} dans la corbeille`, "Annuler", async () => {
    try { await parLots(ids, (lot) => sb.from("oeuvres").update({ supprime_le: null }).in("id", lot)); }
    catch (e) { bandeau("L'annulation a échoué : " + (e.message || e)); }
    vueListe();
  });
}

/* Fenêtre « Modifier un champ » : renvoie les colonnes à mettre à jour, ou null si l'utilisateur renonce. */
function demanderChamp(n, impose) {
  const listeConfig = (cle) => [["", "Aucune valeur (vider le champ)"], ...champSysteme(cle).options.map((v) => [v, v])];
  const CHAMPS = [
    { cle: "statut", libelle: "Statut", options: () => Object.entries(STATUTS) },
    { cle: "technique", libelle: champSysteme("technique").libelle, options: () => listeConfig("technique") },
    { cle: "support", libelle: champSysteme("support").libelle, options: () => listeConfig("support") },
    { cle: "nature", libelle: champSysteme("nature").libelle, options: () => listeConfig("nature") },
    { cle: "serie", libelle: "Série ou thème", saisie: "text" },
    { cle: "annee", libelle: "Année", saisie: "numeric" },
    { cle: "prix_eur", libelle: "Prix (€)", saisie: "decimal" },
    { cle: "prix_masque", libelle: "Affichage du prix sur le site web", options: () => [["non", "Afficher le prix"], ["oui", "Ne pas afficher le prix"]] },
    { cle: "encadre", libelle: "Encadrement", options: () => [["", "Non renseigné"], ["oui", "Encadré"], ["non", "Non encadré"]] }
  ];
  return new Promise((resoudre) => {
    const voile = document.createElement("div"); voile.className = "voile";
    voile.innerHTML = `
      <div class="dialogue large" role="dialog" aria-modal="true" aria-labelledby="lot-titre">
        <h2 id="lot-titre">${impose ? `Modifier « ${esc(CHAMPS.find((c) => c.cle === impose).libelle)} »` : "Modifier un champ"} pour ${n} œuvre${n > 1 ? "s" : ""}</h2>
        <div ${impose ? "hidden" : ""}><label for="lot-champ">Champ à modifier</label>
        <select id="lot-champ">${CHAMPS.map((c, i) => `<option value="${i}" ${c.cle === impose ? "selected" : ""}>${esc(c.libelle)}</option>`).join("")}</select></div>
        <label for="lot-valeur">Nouvelle valeur</label>
        <div id="lot-zone"></div>
        <p class="aide" id="lot-aide"></p>
        <div id="lot-erreur" role="alert"></div>
        <div class="actions">
          <button class="btn" data-r="non">Annuler</button>
          <button class="btn plein" data-r="oui">Appliquer</button>
        </div>
      </div>`;
    document.body.append(voile);
    const q = (sel) => voile.querySelector(sel);
    const champ = () => CHAMPS[+q("#lot-champ").value];
    const dessinerValeur = () => {
      const c = champ();
      q("#lot-zone").innerHTML = c.options
        ? `<select id="lot-valeur">${c.options().map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select>`
        : `<input id="lot-valeur" inputmode="${c.saisie}" autocomplete="off" placeholder="Laisser vide pour effacer la valeur">`;
      q("#lot-aide").textContent = c.cle === "statut"
        ? "Une œuvre vendue qui passe à un autre statut perd son prix de vente, sa date de vente et ses frais de port facturés."
        : `La valeur actuelle de ce champ sera remplacée sur ${n > 1 ? "toutes les œuvres sélectionnées" : "l'œuvre sélectionnée"}.`;
      q("#lot-erreur").innerHTML = "";
    };
    const lire = () => {
      const c = champ(), v = q("#lot-valeur").value;
      if (c.cle === "statut") return v === "vendu" ? { statut: v } : { statut: v, prix_vendu_eur: null, date_vente: null, port_facture_eur: null };
      if (c.cle === "prix_masque") return { prix_masque: v === "oui" };
      if (c.cle === "encadre") return { encadre: v === "" ? null : v === "oui" };
      if (c.cle === "annee") {
        const a = nombre(v);
        if (texte(v) && !(Number.isInteger(a) && a >= 1900 && a <= 2100)) throw new Error("L'année doit comporter quatre chiffres, par exemple 2024.");
        return { annee: a };
      }
      if (c.cle === "prix_eur") {
        const p = nombre(v);
        if (texte(v) && (p === null || p < 0)) throw new Error("Le prix doit être un nombre, par exemple 450.");
        return { prix_eur: p };
      }
      return { [c.cle]: texte(v) };
    };
    const clavier = (e) => { if (e.key === "Escape") fermer(null); };
    const fermer = (r) => { document.removeEventListener("keydown", clavier); voile.remove(); resoudre(r); };
    document.addEventListener("keydown", clavier);
    q("#lot-champ").addEventListener("change", dessinerValeur);
    voile.addEventListener("click", (e) => {
      if (e.target === voile) return fermer(null);
      const b = e.target.closest("[data-r]"); if (!b) return;
      if (b.dataset.r === "non") return fermer(null);
      try { fermer(lire()); }
      catch (err) { q("#lot-erreur").innerHTML = `<div class="message erreur">${msgErreur(err)}</div>`; q("#lot-valeur").setAttribute("aria-invalid", "true"); q("#lot-valeur").focus(); }
    });
    dessinerValeur();
    (impose ? q("#lot-valeur") : q("#lot-champ")).focus();
  });
}

async function selectionModifier(impose) {
  const ids = [...etat.selection], n = ids.length, pl = n > 1 ? "s" : "";
  const maj = await demanderChamp(n, impose);
  if (!maj) return;
  const colonnes = ["id", ...Object.keys(maj)].join(",");
  const avant = [];
  try {
    for (let i = 0; i < ids.length; i += 150) { // valeurs d'origine, pour pouvoir annuler
      const { data, error } = await sb.from("oeuvres").select(colonnes).in("id", ids.slice(i, i + 150));
      if (error) throw error;
      avant.push(...data);
    }
    await parLots(ids, (lot) => sb.from("oeuvres").update(maj).in("id", lot));
  } catch (e) { vueListe(); return bandeau("La modification a échoué : " + (e.message || e)); }
  vueListe();
  bandeau(`${n} œuvre${pl} modifiée${pl}`, "Annuler", async () => {
    const groupes = new Map();
    avant.forEach(({ id, ...valeurs }) => { const k = JSON.stringify(valeurs); if (!groupes.has(k)) groupes.set(k, { valeurs, ids: [] }); groupes.get(k).ids.push(id); });
    try { for (const g of groupes.values()) await parLots(g.ids, (lot) => sb.from("oeuvres").update(g.valeurs).in("id", lot)); }
    catch (e) { bandeau("L'annulation a échoué : " + (e.message || e)); }
    vueListe();
  });
}

/* ---------- Fiche (ajout / modification) ---------- */
async function suggestions() {
  const listes = { serie: new Set() };
  const { data } = await sb.from("oeuvres").select("serie").not("serie", "is", null).is("supprime_le", null).limit(1000);
  (data || []).forEach((o) => Object.keys(listes).forEach((c) => { if (o[c]) listes[c].add(o[c]); }));
  return listes;
}

    if (texte($("#prix").value) && (p === null || p < 0)) return alerte("Le prix doit être un nombre, par exemple 450.", "prix");
    const vendu = $("#statut").value === "vendu";
    const pv = vendu ? nombre($("#prix_vendu").value) : null;
    const dv = vendu ? lireDate($("#date_vente").value) : "";

    if (vendu && ($("#date_vente").validity.badInput || dv === null)) return alerte("La date de la vente n'est pas valide. Format attendu : JJ/MM/AAAA.", "date_vente");
    if (vendu && dv && dv > aujourdhui()) return alerte("La date de la vente ne peut pas être dans le futur.", "date_vente");
    const pf = vendu ? nombre($("#port_facture").value) : null;

    const cp = { ...(o.champs_perso || {}) };
    for (const c of champsPerso()) {
      const el = document.getElementById("cp-" + c.id); if (!el) continue;
      const v = c.type === "case" ? el.checked : c.type === "nombre" ? nombre(el.value) : texte(el.value);
      if (c.type === "nombre" && texte(el.value) && v === null) return alerte(`« ${esc(c.libelle)} » doit être un nombre.`, "cp-" + c.id);
      if (v === null || v === false) delete cp[c.id]; else cp[c.id] = v;

      nature: texte($("#nature").value), serie: texte($("#serie").value),

      encadre: $("#encadre").value === "" ? null : $("#encadre").value === "oui",
      description: texte($("#description").value), emplacement_signature: texte($("#emplacement_signature").value),

    };
    const bouton = $("#valider"); bouton.disabled = true; bouton.setAttribute("aria-busy", "true"); bouton.textContent = "Enregistrement…"; alerte("");
    try {
      const oid = id || crypto.randomUUID();
      const chemins = fichier ? await envoyerPhoto(oid, fichier) : {};
      if (fichier && choisi) { chemins.fichier_origine = choisi.nom; chemins.poids_origine_octets = choisi.poids; }
      else delete chemins.poids_origine_octets; // simple recadrage : le fichier d'origine reste le même
      const req = id
        ? sb.from("oeuvres").update({ ...valeurs, ...chemins }).eq("id", id)
        : sb.from("oeuvres").insert({ id: oid, ...valeurs, ...chemins });
      const { error } = await req;
      if (error) throw error;
      if (id && fichier) await sb.storage.from(BUCKET).remove([o.photo_path, o.vignette_path]);
      etat.modifie = false;
      revenir();

    } catch (err) { bouton.disabled = false; bouton.removeAttribute("aria-busy"); bouton.textContent = "Enregistrer"; alerte(msgErreur(err)); }
  });

  if (id) {
    if (etat.admin) $("#certificat").addEventListener("click", () => {

      vueCertificatNouveau(id);
    });

    b.addEventListener("click", async () => {
      const accord = await confirmer({
        titre: "Supprimer cette œuvre ?",

        vignette: urlPhoto(o.vignette_path), action: "Mettre à la corbeille"

      if (error || !data.length) { b.disabled = false; return alerte(error ? msgErreur(error) : "Suppression refusée."); }
      etat.modifie = false; etat.retour = null;
      vueListe();
      bandeau("Œuvre placée dans la corbeille", "Annuler", async () => {
        await sb.from("oeuvres").update({ supprime_le: null }).eq("id", id);
        vueListe();
      });
    });
  }
}

/* ---------- Suivi des ventes (administrateur) ---------- */
async function chargerVentes() {
  const ventes = [];
  for (let debut = 0; ; debut += 1000) {
    const { data, error } = await sb.from("oeuvres").select("id,titre,nature,technique,vignette_path,prix_eur,prix_vendu_eur,date_vente,port_facture_eur")
      .eq("statut", "vendu").is("supprime_le", null).order("id").range(debut, debut + 999);
    if (error) throw error;
    ventes.push(...data);
    if (data.length < 1000) break;
  }
  return ventes;
}

async function vueVentes() {
  if (!etat.admin) return vueListe();
  majLateral("ventes");
  window.scrollTo(0, 0);
  app.innerHTML = `${entete("Suivi des ventes")}<p class="sous">Chargement…</p>`;
  $("#retour").addEventListener("click", vueListe);
  let ventes;
  try { ventes = await chargerVentes(); }
  catch (e) {
    app.innerHTML = `${entete("Suivi des ventes")}
      <div class="message erreur" role="alert">Les ventes n'ont pas pu être chargées : ${msgErreur(e)}</div>
      <button class="btn" id="reessayer">Réessayer</button>`;
    $("#retour").addEventListener("click", vueListe);
    $("#reessayer").addEventListener("click", () => vueVentes());
    return;
  }
  const montant = (v) => (v.prix_vendu_eur == null ? null : Number(v.prix_vendu_eur));
  const completes = ventes.filter((v) => montant(v) != null && v.date_vente);
  const incompletes = ventes.length - completes.length;
  const annees = [...new Set(completes.map((v) => +v.date_vente.slice(0, 4)))].sort((a, b) => a - b);
  const cfg = etat.ventes;
  if (!annees.includes(cfg.annee)) cfg.annee = annees[annees.length - 1] ?? new Date().getFullYear();
  const somme = (l) => l.reduce((t, v) => t + montant(v), 0);
  const port = (v) => Number(v.port_facture_eur) || 0;
  const sommePort = (l) => Math.round(l.reduce((t, v) => t + port(v), 0) * 100) / 100;
  const avecPort = sommePort(completes) > 0; // deux séries dans le graphique seulement s'il y a du port à montrer
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
  const plafond = (v) => { if (v <= 0) return 100; const p = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((x) => x >= v); };

  const sansAccent = (t) => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const valeurs = (col) => [...new Set(ventes.map((v) => v[col]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
  const VIDE = () => ({ q: "", du: "", au: "", min: null, max: null, nature: "", technique: "", port: "", etat: "" });
  function ligneVente(v) {
    const ecart = montant(v) != null && v.prix_eur != null ? montant(v) - Number(v.prix_eur) : null;
    return `<button class="vente" data-id="${v.id}">
      <img class="fondu" loading="lazy" alt="" src="${esc(urlPhoto(v.vignette_path))}">
      <div class="corps"><div class="titre">${esc(v.titre)}</div>
        <div class="sous">${v.nature ? `${esc(v.nature)}, ` : ""}${v.date_vente ? `<span class="long">${v.nature ? "vendue le " : "Vendue le "}</span>${esc(dateFr(v.date_vente))}` : `<span class="manque">Date à compléter</span>`}</div></div>
      <div class="droite"><div class="montant">${montant(v) != null ? esc(euros(montant(v))) : `<span class="manque">Prix à compléter</span>`}</div>
        <div class="sous">${v.prix_eur != null ? `Affiché ${esc(euros(Number(v.prix_eur)))}` : "Sans prix affiché"}${ecart ? `, soit ${ecart > 0 ? "+" : "−"}${esc(euros(Math.abs(ecart)))}` : ""}</div>
        ${port(v) ? `<div class="sous port-ligne"><i></i>Port ${esc(euros(port(v)))}</div>` : ""}</div>
    </button>`;
  }
  // Liste des ventes : recherche, panneau de filtres, filtres actifs retirables un à un, tri
  function monterListe(series) {
    const f = cfg.f;
    const remplir = () => {
      $("#v-q").value = f.q; $("#vf-du").value = f.du; $("#vf-au").value = f.au;
      $("#vf-min").value = enSaisie(f.min); $("#vf-max").value = enSaisie(f.max);
      for (const c of ["nature", "technique", "port", "etat"]) { const el = $("#vf-" + c); el.value = f[c]; if (el.value !== f[c]) f[c] = ""; } // valeur disparue des ventes
      $("#vf-erreur").innerHTML = "";
    };
    const actifs = () => {
      const l = [], per = series.find((x) => x.cle === cfg.periode);
      if (per) l.push(["periode", `Période : ${per.nom.replace("Année ", "")}`]);
      if (f.q) l.push(["q", `Titre contenant « ${f.q} »`]);
      if (f.du || f.au) l.push(["dates", `Vendue ${f.du ? `du ${dateFr(f.du)} ` : ""}${f.au ? `${f.du ? "au" : "jusqu'au"} ${dateFr(f.au)}` : ""}`.trim()]);
      if (f.min != null || f.max != null) l.push(["prix", `Prix ${f.min != null ? `de ${euros(f.min)} ` : ""}${f.max != null ? `${f.min != null ? "à" : "jusqu'à"} ${euros(f.max)}` : ""}`.trim()]);
      if (f.nature) l.push(["nature", `Nature : ${f.nature}`]);
      if (f.technique) l.push(["technique", `Technique : ${f.technique}`]);
      if (f.port) l.push(["port", f.port === "avec" ? "Avec port facturé" : "Sans port facturé"]);
      if (f.etat) l.push(["etat", f.etat === "complete" ? "Fiches complètes" : "Fiches à compléter"]);
      return l;
    };
    const retenue = (v) => {
      const m = montant(v), d = v.date_vente || "";
      if (cfg.periode && !d.startsWith(cfg.periode)) return false;
      if (f.q && !sansAccent(v.titre).includes(sansAccent(f.q))) return false;
      if (f.du && !(d && d >= f.du)) return false;
      if (f.au && !(d && d <= f.au)) return false;
      if (f.min != null && !(m != null && m >= f.min)) return false;
      if (f.max != null && !(m != null && m <= f.max)) return false;
      if (f.nature && v.nature !== f.nature) return false;
      if (f.technique && v.technique !== f.technique) return false;
      if (f.port === "avec" && !port(v)) return false;
      if (f.port === "sans" && port(v)) return false;
      const complete = m != null && !!v.date_vente;
      if (f.etat === "complete" && !complete) return false;
      if (f.etat === "incomplete" && complete) return false;
      return true;
    };
    const parTitre = (a, b) => a.titre.localeCompare(b.titre, "fr", { numeric: true, sensitivity: "base" });
    const dernier = (x, y) => (x == null) - (y == null); // les valeurs absentes toujours en fin de liste
    const ORDRES = {
      "date-desc": (a, b) => dernier(a.date_vente, b.date_vente) || (b.date_vente || "").localeCompare(a.date_vente || "") || parTitre(a, b),
      "date-asc": (a, b) => dernier(a.date_vente, b.date_vente) || (a.date_vente || "").localeCompare(b.date_vente || "") || parTitre(a, b),
      "prix-desc": (a, b) => dernier(montant(a), montant(b)) || montant(b) - montant(a) || parTitre(a, b),
      "prix-asc": (a, b) => dernier(montant(a), montant(b)) || montant(a) - montant(b) || parTitre(a, b),
      "titre-asc": parTitre
    };
    let affichees = [];
    // Export CSV de la liste telle qu'affichée (filtres et tri compris) : point-virgule, virgule décimale et BOM pour Excel en français
    function exporter() {
      const nb = (x) => (x == null ? "" : String(Math.round(Number(x) * 100) / 100).replace(".", ","));
      const cellule = (x) => { let t = x == null ? "" : String(x); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; }; // pas de formule exécutable à l'ouverture
      const lignes = [["Date de vente", "Titre", "Nature", "Technique", "Prix affiché (€)", "Prix de vente (€)", "Frais de port facturés (€)", "Total encaissé (€)", "Fiche de vente"]];
      for (const v of affichees) {
        const m = montant(v);
        lignes.push([v.date_vente ? dateFr(v.date_vente) : "", v.titre, v.nature, v.technique, nb(v.prix_eur), nb(m), port(v) ? nb(port(v)) : "", m == null ? "" : nb(m + port(v)), m != null && v.date_vente ? "Complète" : "À compléter"]);
      }
      const csv = "\ufeff" + lignes.map((l) => l.map((x, i) => (i >= 4 && i <= 7 ? x : cellule(x))).join(";")).join("\r\n") + "\r\n";
      const lien = document.createElement("a"), adresse = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      lien.href = adresse; lien.download = `ventes-pauline-bonnete-${aujourdhui()}.csv`;
      document.body.append(lien); lien.click(); lien.remove();
      setTimeout(() => URL.revokeObjectURL(adresse), 4000);
      bandeau(`${pluriel(affichees.length, "vente")} exportée${affichees.length > 1 ? "s" : ""} dans le fichier ${lien.download}`);
    }
    function maj() {
      const liste = ventes.filter(retenue).sort(ORDRES[cfg.tri] || ORDRES["date-desc"]), la = actifs();
      const comptees = liste.filter((v) => montant(v) != null && v.date_vente), horsTotal = liste.length - comptees.length, nbPanneau = la.filter(([c]) => c !== "periode" && c !== "q").length;
      affichees = liste; $("#v-export").disabled = !liste.length;
      $("#v-nb").hidden = !nbPanneau; $("#v-nb").textContent = nbPanneau;
      $("#v-actifs").hidden = !la.length;
      $("#v-actifs").innerHTML = la.length ? `<span class="sous">Filtres actifs</span>${la.map(([c, l]) => `<span class="actif">${esc(l)}<button type="button" data-retirer="${c}" aria-label="Retirer le filtre : ${esc(l)}">${ICONES.fermer}</button></span>`).join("")}<button class="btn discret" type="button" id="v-tout">Tout effacer</button>` : "";
      $("#v-resume").textContent = !liste.length ? "" : `${la.length ? `${pluriel(liste.length, "vente")} sur ${ventes.length}` : pluriel(liste.length, "vente")} : ${euros(somme(comptees))} de tableaux${sommePort(comptees) ? ` et ${euros(sommePort(comptees))} de frais de port` : ""}${horsTotal ? `, hors ${pluriel(horsTotal, "vente")} à compléter` : ""}.`;
      $("#liste-ventes").innerHTML = liste.map(ligneVente).join("") || `<div class="vide-filtre"><p>Aucune vente ne correspond ${la.length > 1 ? "à ces filtres" : la.length ? "à ce filtre" : "pour l'instant"}.</p>${la.length ? `<button class="btn" type="button" id="v-tout-2">Effacer les filtres</button>` : ""}</div>`;
    }
    const effacer = (cle) => {
      const avait = !!cfg.periode;
      if (cle === "periode" || cle === "tout") cfg.periode = null;
      if (cle === "tout") Object.assign(f, VIDE());
      else if (cle === "dates") { f.du = ""; f.au = ""; }
      else if (cle === "prix") { f.min = null; f.max = null; }
      else if (cle !== "periode") f[cle] = "";
      if (avait && !cfg.periode) return dessiner(false); // la barre du graphique doit aussi se désélectionner
      remplir(); maj();
    };
    let attente;
    $("#v-q").addEventListener("input", (e) => { clearTimeout(attente); attente = setTimeout(() => { f.q = e.target.value.trim(); maj(); }, 200); });
    $("#v-tri").addEventListener("change", (e) => { cfg.tri = e.target.value; maj(); });
    $("#v-export").addEventListener("click", exporter);
    $("#v-filtres").addEventListener("click", () => { cfg.panneau = !cfg.panneau; $("#v-panneau").hidden = !cfg.panneau; $("#v-filtres").setAttribute("aria-expanded", String(cfg.panneau)); if (cfg.panneau) $("#vf-du").focus(); });

      if ($("#vf-au").validity.badInput || au === null) return refus("La date de fin n'est pas valide. Format attendu : JJ/MM/AAAA.", "vf-au");

      const min = texte($("#vf-min").value) ? nombre($("#vf-min").value) : null, max = texte($("#vf-max").value) ? nombre($("#vf-max").value) : null;
      if (texte($("#vf-min").value) && (min === null || min < 0)) return refus("Le prix minimum doit être un nombre, par exemple 300.", "vf-min");
      if (texte($("#vf-max").value) && (max === null || max < 0)) return refus("Le prix maximum doit être un nombre, par exemple 600.", "vf-max");
      if (min != null && max != null && min > max) return refus("Le prix minimum est supérieur au prix maximum.", "vf-min");
      Object.assign(f, { du: du || "", au: au || "", min, max, nature: $("#vf-nature").value, technique: $("#vf-technique").value, port: $("#vf-port").value, etat: $("#vf-etat").value });

    $("#bloc-liste").addEventListener("click", (e) => {
      const r = e.target.closest("[data-retirer]");

    remplir(); maj();
  }

  function dessiner(anime = true) {
    const parMois = cfg.grain === "mois";
    const series = parMois
      ? MOIS.map((m, i) => ({ cle: `${cfg.annee}-${String(i + 1).padStart(2, "0")}`, long: m, court: m[0].toUpperCase(), nom: `${MOIS_LONGS[i]} ${cfg.annee}` }))
      : (annees.length ? Array.from({ length: annees[annees.length - 1] - annees[0] + 1 }, (_, i) => annees[0] + i) : [cfg.annee])
          .map((a) => ({ cle: String(a), long: String(a), court: String(a).slice(2), nom: `Année ${a}` }));
    series.forEach((s) => { const l = completes.filter((v) => v.date_vente.startsWith(s.cle)); s.total = somme(l); s.port = sommePort(l); s.n = l.length; });
    if (cfg.periode && !series.some((s) => s.cle === cfg.periode)) cfg.periode = null;
    const haut = plafond(Math.max(...series.map((s) => s.total + s.port)));
    const duGraphe = parMois ? completes.filter((v) => v.date_vente.startsWith(String(cfg.annee))) : completes;

    app.innerHTML = `
      ${entete("Suivi des ventes")}
      ${!ventes.length ? `<div class="carte vide">Aucune vente enregistrée pour l'instant.<br>Passez une œuvre au statut « Vendu » pour la voir apparaître ici.</div>` : `
      <div class="tuiles quatre">
        <div class="tuile"><div class="v">${esc(euros(somme(completes)))}</div><div class="l">Total des ventes, hors port</div></div>

        <div class="tuile"><div class="v">${ventes.length}</div><div class="l">${ventes.length > 1 ? "Œuvres vendues" : "Œuvre vendue"}</div></div>
        <div class="tuile"><div class="v">${completes.length ? esc(euros(Math.round(somme(completes) / completes.length))) : "—"}</div><div class="l">Prix de vente moyen</div></div>
      </div>

        <div class="commandes">
          <h2 style="margin:0">${parMois ? `Ventes par mois en ${cfg.annee}` : "Ventes par année"}</h2>

            <div class="segment" id="grain" role="group" aria-label="Granularité du graphique">
              <button data-grain="mois" aria-pressed="${parMois}">Mois</button>

        <p class="sous" style="margin:0 0 ${avecPort ? 10 : 18}px">${sommePort(duGraphe)
          ? `${esc(euros(somme(duGraphe)))} de tableaux et ${esc(euros(sommePort(duGraphe)))} de frais de port, soit ${esc(euros(somme(duGraphe) + sommePort(duGraphe)))} encaissés`
          : esc(euros(somme(duGraphe)))} pour ${pluriel(duGraphe.length, "vente")}${parMois ? ` en ${cfg.annee}` : ""}. Touchez une barre pour filtrer la liste.</p>

        <div class="graphe ${cfg.periode ? "filtre" : ""} ${anime ? "anime" : ""}" id="graphe">
          <div class="ordonnees" aria-hidden="true"><span>${esc(euros(haut))}</span><span>${esc(euros(haut / 2))}</span><span>0 €</span></div>

            <div class="infobulle" id="infobulle" hidden></div>
