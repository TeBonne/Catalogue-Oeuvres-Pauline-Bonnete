name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parcours:
    name: Parcours du back-office (téléphone et ordinateur)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Installer les outils de test
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Jouer les parcours
        run: python -m pytest tests -q
